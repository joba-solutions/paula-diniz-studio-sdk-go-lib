name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "2026.2.2"
          install-go: false

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

      - name: Test
        run: go test ./... -race -shuffle=on

      - name: Build
        run: go build ./...
